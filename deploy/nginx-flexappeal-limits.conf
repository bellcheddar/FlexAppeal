# Rate-limit zone for FlexAppeal, installed to /etc/nginx/conf.d/ by
# provision.sh. A limit_req_zone has to be declared at http scope, which a
# sites-available file is not -- hence the separate snippet.
#
# Six a minute with a burst of three: generous for a person configuring a run,
# tight enough that nobody can drive the box by looping uploads.
#
# Keyed on the method as well as the address, because the thing worth limiting
# is the upload and not the path it arrives on. `/analysis/` serves a run's
# structure and trajectory to the 3D viewer as well as accepting a results
# file, so with the address alone a reader opening three run pages in a minute
# spent the whole allowance on GETs and the viewer came back 503. That is
# exactly what happened the first time the reference-state runs were deployed
# into the Runs library, where there are four of them to click between.
#
# nginx does not account a request whose key is empty, which is what makes this
# work: every GET maps to "" and is not counted at all.
#
# The zone is `flexappeal_writes` and not `flexappeal_upload`, which is not
# cosmetic. A shared-memory zone keeps its key for the life of the process, so
# changing the key of an existing zone is refused on reload:
#
#   [emerg] limit_req "flexappeal_upload" uses the "$flexappeal_write" key
#           while previously it used the "$binary_remote_addr" key
#
# `nginx -t` passes, because it tests the configuration in isolation, and the
# reload then fails and leaves the old configuration running. It did exactly
# that here, and the 503s carried on while the deploy said it had reloaded. A
# new name is a new zone, so the change applies on a reload and the other four
# applications on this box are never restarted for it.
map $request_method $flexappeal_write {
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    default "";
}

limit_req_zone $flexappeal_write zone=flexappeal_writes:10m rate=6r/m;
