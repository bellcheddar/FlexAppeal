# nginx site for FlexAppeal. provision.sh substitutes __SERVER_NAME__ and
# __BIND_ADDR__ and installs this to /etc/nginx/sites-available/flexappeal,
# then certbot --nginx adds the TLS block.

# Rate limiting for the two routes that cost real work: parsing a results file
# and starting a re-analysis. Declared at http scope via a conf.d snippet in
# provision.sh; referenced per-location below.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # MUST stay in sync with MAX_CONTENT_LENGTH in flexappeal/webapp.py.
    # nginx rejects an oversized body before it reaches Python; Flask catches
    # anything that slips past. A mismatch means one of them produces an
    # unhelpful error instead of the friendly 413 page.
    client_max_body_size 250m;
    client_body_timeout 300s;

    # The vendored libraries are large -- plotly.min.js is 4.5 MB and
    # molstar.js is 5 MB -- so nginx serves them from disk rather than
    # gunicorn holding a worker for the duration.
    location /static/ {
        alias /opt/flexappeal/flexappeal/static/;
        # Every asset URL carries ?v=<mtime>, so a changed file fetches fresh
        # and an unchanged one can be cached hard.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Uploading a results file: expensive to parse, so rate limited.
    location /analysis {
        limit_req zone=flexappeal_upload burst=3 nodelay;
        proxy_pass http://__BIND_ADDR__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MUST stay in sync with `timeout` in deploy/gunicorn.conf.py.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Building a bundle: templating plus a CCD fetch per ligand.
    location /prepare {
        limit_req zone=flexappeal_upload burst=3 nodelay;
        proxy_pass http://__BIND_ADDR__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://__BIND_ADDR__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
