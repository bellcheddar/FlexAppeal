[workspace]
name = "flexappeal"
version = "0.1.0"
description = "Prepare OpenMM molecular dynamics runs, analyse what comes back"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# This is the DEVELOPMENT environment for FlexAppeal itself, not the environment
# a generated bundle uses. Those are two different things and conflating them
# would be a mistake:
#
#   * this file    -- everything needed to develop and test the app on a Mac,
#                     including a real OpenMM so tests/test_openmm_symbols.py can
#                     resolve every `openmm=` reference in the option registry
#   * runtime/pixi.toml.j2 -- rendered per-bundle, pinned, osx-arm64 only, and
#                     containing only what that specific run actually needs
#
# The droplet uses neither: it installs requirements.txt with plain pip, because
# nothing it does needs OpenMM at all.
#
# python = 3.11: openff-toolkit and openmmforcefields both lag the current Python
# release on conda-forge, and 3.11 is the newest both have builds for across
# osx-arm64 and linux-64. Check `pixi search openff-toolkit` before raising it.

[dependencies]
python = "3.11.*"

# --- The MD stack (needed to test generated scripts, not to serve the app) ---
openmm = ">=8.2"
pdbfixer = "*"
# Provides the GAFF/OpenFF/espaloma template generators used for ligands. Pulls
# ambertools, which is large (~1 GB) but is what AM1-BCC charging actually needs;
# there is no lighter route to correct ligand charges.
openmmforcefields = "*"
openff-toolkit = "*"

# --- Analysis ---
mdtraj = "*"
numpy = "*"
scipy = "*"
# Declared rather than added: rdkit already arrives with openff-toolkit, so this
# changes nothing about the solve. flexappeal/measure.py uses it for the MMFF94
# ligand strain in an .fxa version 2 package, and the same reasoning as rich and
# psutil below applies -- a change in something else's dependencies would remove
# it silently. The import is lazy and optional: without rdkit the conformation
# sub-score is left pending rather than the package failing.
rdkit = "*"

# --- Reference-state examples (FLEXAPPEAL_REFSTATES_BUILD_SPEC.md section 3) ---
# Membrane analysis the GPCR example needs: area per lipid, bilayer thickness,
# helix axes. mdtraj covers the rest of the per-frame work and is already here.
mdanalysis = "*"
# KLIFS and GPCRdb are REST APIs, fetched with a disk cache and polite retries.
# urllib is the spec's fallback and would mean hand-rolling both.
requests = "*"
tenacity = "*"
# The per-residue DSSP store is Parquet: a frame by residue string table per run
# is too wide for SQLite and too big for JSON.
pyarrow = "*"
duckdb = "*"
# Neither is used by FlexAppeal. Both are here because the vendored
# `sse_comparison` modules import BoltzMaker's main module for `_align_positions`
# (the numbering-offset reconciliation the spec says not to reimplement), and
# that module imports a spreadsheet writer and a plotting library at module
# scope. Wrapping rather than editing the vendored copy is the rule (spec 4.1),
# so the dependencies travel instead of a patch.
#
# BoltzMaker's own pins are deliberately not adopted: it holds gemmi at 0.6.5,
# scipy at 1.13 and biopython at 1.84 to match boltz, and this environment runs
# newer versions that FlexAppeal's own code is tested against. Only the two
# import-time packages are taken.
openpyxl = "*"
plotly = "*"

# --- Web app (mirrors requirements.txt so local and droplet behave alike) ---
flask = ">=3.0"
gunicorn = ">=21.2"
jinja2 = ">=3.1"
gemmi = ">=0.6.5"
python-dotenv = "*"

# --- Console ---
# Used by the CLI and by the generated run/analysis scripts. Both arrive
# transitively today, which is not a reason to leave them undeclared: a change
# in something else's dependencies would remove them silently.
rich = ">=13.0"
psutil = "*"

# --- Development ---
pytest = ">=8.0"

[pypi-dependencies]
# Section 10's page QC. conda-forge's `playwright` package is the Node CLI
# only, with no Python bindings, so the bindings come from PyPI. Both use the
# same browser cache under ~/Library/Caches/ms-playwright, so whichever side
# fetched Chromium, the other finds it.
playwright = "*"
# axe-core is a JavaScript library and is injected into the page from the
# bundled copy rather than fetched at test time: a test that needs the network
# fails when the network does.
axe-playwright-python = "*"

[tasks]
playwright-browser = "playwright install chromium"
test-pages = "python -m pytest tests/test_pages.py -q"
test = "python -m pytest tests/ -q"
serve = "python FlexAppeal.py serve"
docs = "python FlexAppeal.py docs"
bundle = "python FlexAppeal.py bundle"

[activation.env]
# conda-forge's scientific stack and any pip-installed package that bundles its
# own libomp will both try to initialise OpenMP in one process, which aborts with
# "OMP: Error #15 ... already initialized" on macOS. Same mitigation as
# BoltzMaker's pixi.toml, and for the same reason.
KMP_DUPLICATE_LIB_OK = "TRUE"
