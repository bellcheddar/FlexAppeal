# Collect FlexAppeal's own tests and not the vendored package's.
#
# `vendor/boltzmaker` ships its own suite, which shells out to
# `vendor/boltzmaker/.venv/bin/python3`. That interpreter does not exist inside
# this pixi environment, so those tests fail on a path rather than on anything
# about BoltzMaker or about FlexAppeal: 17 failures that mean nothing here.
#
# `pixi run test` was already scoped to `tests/`, but a bare `pytest` from the
# repository root was not, and it reports those 17 as failures of this project.
# I read that output as a real regression during this build before checking
# where the failures lived, which is the mistake this file prevents.
[pytest]
testpaths = tests
norecursedirs = vendor .pixi .venv-dev data deploy examples docs
